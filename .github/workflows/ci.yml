name: CI

on:
  push:
    branches: [updateV2]
  pull_request:
    branches: [updateV2]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run build
        env:
          PUBLIC_MAIL: ci@example.com
          PUBLIC_PHONE: "+00 000 000 000"
